name: Update emulator catalogs

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7,19 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check GitHub releases and regenerate catalogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_catalog.py --refresh
      - name: Validate generated catalogs
        run: python scripts/update_catalog.py --check
      - name: Commit changed metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/emulators.json catalog.json json data/emulators.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update emulator release catalogs"
            git push
          else
            echo "No emulator releases changed"
          fi
